syntax = "proto3";

package planny.todo.v1;

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

// このファイルはTodoServiceと関連するメッセージを定義しています。
// サービスはGoogle API Design Guideの原則に従います。
// 各RPCメソッドは、Todoリソースを管理するためのCRUD操作に対応しています。

service TodoService {
  // CreateTodoメソッドは新しいTodoアイテムを作成します。
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoResponse) {}

  // GetTodoメソッドは指定されたリソース名のTodoアイテムを取得します。
  rpc GetTodo(GetTodoRequest) returns (GetTodoResponse) {}

  // UpdateTodoメソッドは既存のTodoアイテムを更新します。
  rpc UpdateTodo(UpdateTodoRequest) returns (UpdateTodoResponse) {}

  // ListTodosメソッドはTodoアイテムのリストを取得します。
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse) {}

  // DeleteTodoメソッドは指定されたリソース名のTodoアイテムを削除します。
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse) {}

  // UndeleteTodoメソッドは削除されたTodoアイテムを復元します。
  rpc UndeleteTodo(UndeleteTodoRequest) returns (UndeleteTodoResponse) {}
}

message CreateTodoRequest {
  // タイトル
  string title = 1;

  // 詳細説明
  string description = 2;

  // 予定日
  google.type.Date due_date = 3;

  //　優先順位
  int32 priority = 4;
}

message CreateTodoResponse {
  Todo todo = 1;
}

message GetTodoRequest {
  // 取得するTodoアイテムのリソース名
  string name = 1;
}

message GetTodoResponse {
  Todo todo = 1;
}

message UpdateTodoRequest {
  // 更新するTodoアイテムのリソース名
  string name = 1;

  // 更新後のタイトル
  string title = 2;

  // 更新後の詳細説明
  string description = 3;

  // 更新後の予定日
  google.type.Date due_date = 4;

  // 優先順位
  int32 priority = 5;
}

message UpdateTodoResponse {
  Todo todo = 1;
}

message DeleteTodoRequest {
  // 削除するTodoアイテムのリソース名
  string name = 1;
}

message DeleteTodoResponse {
  Todo todo = 1;
}

message UndeleteTodoRequest {
  // 復元するTodoアイテムのリソース名
  string name = 1;
}

message UndeleteTodoResponse {
  Todo todo = 1;
}

message ListTodosRequest {
  bool show_deleted = 1; // 削除されたTodoアイテムも表示するかどうか
}

message ListTodosResponse {
  // Todoアイテムのリスト
  repeated Todo todos = 1;
}

message Todo {
  // Todoアイテムのリソース名
  string name = 1;

  // Todoアイテムのタイトル
  string title = 2;
  // Todoアイテムの詳細説明
  string description = 3;

  int32 priority = 4;

  // 予定日
  google.type.Date due_date = 5;

  TodoStatus status = 6;

  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp deleted_at = 9;
}

enum TodoStatus {
  TODO_STATUS_UNSPECIFIED = 0;
  TODO_STATUS_ACTIVE = 1; // やる予定
  TODO_STATUS_COMPLETED = 2; // 完了
  TODO_STATUS_REVOKED = 3; // 取り消し
  TODO_STATUS_ARCHIVED = 4; // アーカイブ
}
