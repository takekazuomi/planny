syntax = "proto3";

package planny.todo.v1;

// SubCodeは、エラーのサブコード
enum TodoError {
  // 未定義のエラー
  TODO_ERROR_UNSPECIFIED = 0;

  // 一日の最大タスクに達しました
  TODO_ERROR_MAX_TASK_REACHED = 1;
}

// TodoServiceのエラーコード
message TodoErrorInfo {
  // Todoアイテムのエラーコード
  TodoError reason = 1;

  // エラーメッセージ
  string message = 2;

  string details = 3;
}
