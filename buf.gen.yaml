version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/takekazuomi/planny/pkg/gen
    except:
      - buf.build/googleapis/googleapis
      - buf.build/google/type
plugins:
  - name: go
    out: pkg/gen
    opt: paths=source_relative
  - name: connect-go
    out: pkg/gen
    opt: paths=source_relative
